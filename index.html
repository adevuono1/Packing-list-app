<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Equipaje">
<meta name="theme-color" content="#F6F3EE">
<title>Lista de equipaje</title>
<style>
  :root {
    --bg: #F6F3EE; --card: #FFFFFF; --fg: #1F1D1A; --muted: #7A746B;
    --line: #E4DED4; --accent: #1F6F6B; --accent-fg: #FFFFFF; --danger: #B5483A;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161513; --card: #211F1C; --fg: #F2EEE7; --muted: #958E84;
      --line: #36322D; --accent: #5FB8B2; --accent-fg: #101414; --danger: #E08072;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px))
         env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
  main { max-width: 640px; margin: 0 auto; padding-block: 16px 48px; }
  h1 { font-size: 28px; margin: 4px 0 12px; letter-spacing: -0.02em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 4px; }
  .summary { font-size: 12px; color: var(--muted); margin: 0 0 8px; line-height: 1.5; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); flex: 1; min-width: 0; }
  input, select { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 10px; width: 100%; min-width: 0; }
  select { background: var(--card); }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .row2 { display: flex; gap: 10px; }
  .row2 label.field:first-child { flex: 0 0 90px; }
  .progress { margin: 4px 0 18px; }
  .track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar { height: 100%; background: var(--accent); transition: width .2s; }
  .progress span { display: block; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .item { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center;
    padding: 10px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .packed .name { text-decoration: line-through; color: var(--muted); }
  .name { border: 0; padding: 4px 0; font-size: 16px; }
  input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; }
  .meta { grid-column: 2 / 4; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .meta .qty { width: 72px; padding: 6px 8px; font-size: 14px; text-align: center; }
  .meta select { width: auto; flex: 1 1 150px; padding: 6px 8px; font-size: 14px; }
  .total { font-size: 13px; color: var(--muted); margin-left: auto; }
  .del { background: none; border: 0; color: var(--danger); font: inherit; font-size: 13px; padding: 4px; }
  form.add { display: flex; gap: 8px; margin-top: 10px; }
  button { font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
    color: var(--fg); padding: 10px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 600; }
  .sug { font-size: 12px; padding: 6px 8px; white-space: nowrap; color: var(--accent); border-color: var(--accent); background: transparent; }
  .sug.on { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; }
  .tools button { flex: 1 1 auto; }
  .cnote { border: 0; border-bottom: 1px dashed var(--line); border-radius: 0; padding: 4px 0; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .bagsec { padding: 8px 0; border-top: 1px solid var(--line); }
  .bagsec:first-of-type { border-top: 0; }
  .bagtitle { font-weight: 600; margin-bottom: 4px; }
  .line { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; padding: 2px 0; }
  .catname { color: var(--muted); font-size: 12px; }
  .qtyv { font-variant-numeric: tabular-nums; }
  .empty { font-size: 13px; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 16px; line-height: 1.5; }
</style>
</head>
<body>
<main id="app"></main>
<script>
const KEY = 'packing-list-v1';
const LOCATIONS = ['Maleta facturada', 'Maleta de mano', 'Objeto personal', 'Otro'];
const LEGACY_BAG_MAP = { 'Checked': 'Maleta facturada', 'Facturada': 'Maleta facturada',
  'Carry-on': 'Maleta de mano', 'Personal item': 'Objeto personal' };

let uidCounter = 0;
function uid() { return 'i' + Date.now().toString(36) + (++uidCounter); }

const seed = {
  trip: { destination: '', days: 5 },
  categories: [
    { id: 'ropa', name: 'Ropa', items: [
      ['Camisetas', 4], ['Pantalones', 3], ['Ropa interior', 6], ['Calcetines', 6],
      ['Pijama', 1], ['Zapatos', 1], ['Chanclas', 1]
    ]},
    { id: 'aseo', name: 'Aseo', items: [
      ['Desodorante', 1], ['Cepillo de dientes', 1], ['Pasta de dientes', 1], ['Enjuague bucal', 1],
      ['Cepillo del pelo', 1], ['Serum', 1], ['Protector solar', 1], ['Crema de ojos', 1],
      ['Champú', 1], ['Gel facial', 1], ['Esponja', 1], ['Maquinilla', 1]
    ]},
    { id: 'electronica', name: 'Electrónica', items: [
      ['Cargador simple', 1], ['Cargador múltiple', 1], ['Cable C a C 180 cm', 1], ['Cable C a C 100 cm', 1],
      ['Cable C a C 30 cm', 1], ['Cable A a C 100 cm', 1], ['Powerbank 10.000 mAh', 1],
      ['Powerbank 20.000 mAh', 1], ['AirPods', 1], ['Sony XM5', 1], ['AirFly', 1],
      ['Báscula de equipaje', 1], ['Adaptador Américas', 1], ['Adaptador Europa', 1]
    ]}
  ].map(c => ({ id: c.id, name: c.name, note: '', items: c.items.map(([name, qty]) => ({
    id: uid(), name, qty, where: '', packed: false, worn: false })) }))
};

// Recomendaciones según el número de días
const RULES = {
  camisetas:     d => Math.max(0, d - 1),
  pantalones:    d => Math.ceil(d / 2),
  ropa_interior: d => d + 1,
  calcetines:    d => d + 1,
  pijama:        d => Math.floor(d / 4),
  chaquetas:     d => Math.ceil(d / 5),
};
const RULE_BY_NAME = {
  'Camisetas': 'camisetas', 'Pantalones': 'pantalones', 'Ropa interior': 'ropa_interior',
  'Calcetines': 'calcetines', 'Pijama': 'pijama', 'Chaquetas': 'chaquetas'
};

// Convierte cualquier estado (nuevo, guardado o importado) al formato actual
function normalize(s) {
  s.trip = s.trip || {};
  delete s.trip.bags;
  s.categories.forEach(c => {
    if (c.note === undefined) c.note = '';
    c.items.forEach(i => {
      if (i.split) {
        // Formato anterior: cantidades repartidas por maleta
        const parts = Object.entries(i.split).filter(([, n]) => n > 0);
        i.qty = parts.reduce((s2, [, n]) => s2 + n, 0);
        i.where = parts.length ? (LEGACY_BAG_MAP[parts.sort((a, b) => b[1] - a[1])[0][0]] || '') : '';
        delete i.split;
      }
      if (i.where === undefined) i.where = '';
      if (i.qty === undefined) i.qty = 0;
      i.qty = Math.max(0, parseInt(i.qty, 10) || 0);
      i.worn = !!i.worn;
      i.packed = !!i.packed;
      if (!i.rule && RULE_BY_NAME[i.name]) i.rule = RULE_BY_NAME[i.name];
    });
  });
  const ropa = s.categories.find(c => c.id === 'ropa');
  if (ropa && !ropa.items.some(i => i.rule === 'chaquetas')) {
    ropa.items.push({ id: uid(), name: 'Chaquetas', qty: 0, where: '', packed: false, worn: false, rule: 'chaquetas' });
  }
  return s;
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return structuredClone(seed);
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

let state = normalize(load());

// Helpers de cuentas
function wornUnits(item) { return item.worn ? 1 : 0; }
function totalOf(item) { return item.qty + wornUnits(item); }
function daysCount() { return Math.max(0, parseInt(state.trip.days, 10) || 0); }
function suggestion(item) {
  const fn = item.rule && RULES[item.rule];
  return fn ? fn(daysCount()) : null;
}

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'checked') n.checked = v;
    else if (k === 'value') n.value = v;
    else n.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) n.append(c);
  return n;
}

function field(labelText, value, onChange, type = 'text', placeholder = '') {
  const input = el('input', { type, value: value ?? '', placeholder, onchange: e => onChange(e.target.value) });
  return el('label', { class: 'field' }, labelText, input);
}

function render() {
  const app = document.getElementById('app');
  app.replaceChildren();

  // Progreso: solo objetos que van en la maleta (no los puestos)
  const all = state.categories.flatMap(c => c.items).filter(i => i.qty > 0);
  const done = all.filter(i => i.packed).length;
  const pct = all.length ? Math.round(done / all.length * 100) : 0;

  app.append(
    el('h1', { text: 'Equipaje' }),
    el('section', { class: 'card' },
      field('Destino', state.trip.destination, v => { state.trip.destination = v; save(); }, 'text', 'Ej.: Lisboa'),
      el('div', { class: 'row2', style: 'margin-top:10px' },
        field('Días', state.trip.days, v => { state.trip.days = v; save(); render(); }, 'number')
      )
    ),
    el('div', { class: 'progress' },
      el('div', { class: 'track' }, el('div', { class: 'bar', style: `width:${pct}%` })),
      el('span', { text: `${done} de ${all.length} empaquetados` })
    )
  );

  for (const cat of state.categories) app.append(renderCategory(cat));
  app.append(renderByBag());

  app.append(
    el('section', { class: 'card' },
      el('h2', { text: 'Nueva categoría' }),
      el('form', { class: 'add', onsubmit: e => {
        e.preventDefault();
        const name = e.target.elements.name.value.trim();
        if (!name) return;
        state.categories.push({ id: uid(), name, note: '', items: [] });
        save(); render();
      }},
        el('input', { name: 'name', placeholder: 'Ej.: Documentos', 'aria-label': 'Nombre de la categoría' }),
        el('button', { class: 'primary', type: 'submit', text: 'Añadir' })
      )
    ),
    el('div', { class: 'tools' },
      el('button', { text: 'Aplicar sugerencias', onclick: applySuggestions }),
      el('button', { text: 'Desmarcar todo', onclick: () => {
        state.categories.forEach(c => c.items.forEach(i => { i.packed = false; i.worn = false; }));
        save(); render();
      }}),
      el('button', { text: 'Exportar copia', onclick: exportData }),
      importButton()
    ),
    el('p', { class: 'hint', text: 'Tus datos se guardan en este iPhone. Usa "Exportar copia" de vez en cuando para tener un respaldo.' })
  );
}

function renderCategory(cat) {
  const counts = LOCATIONS.map(l => `${l} ${cat.items.filter(i => i.where === l).reduce((s, i) => s + i.qty, 0)}`);
  const worn = cat.items.filter(i => i.worn).length;
  const total = cat.items.reduce((s, i) => s + totalOf(i), 0);
  const summary = [...counts, ...(worn ? [`Puestas ${worn}`] : []), `Total ${total}`].join(' · ');

  const list = el('div', { class: 'card' },
    el('h2', { text: cat.name }),
    el('input', { class: 'cnote', value: cat.note || '', placeholder: 'Descriptor (ej.: ropa de abrigo)', 'aria-label': 'Descriptor de la categoría', onchange: e => {
      cat.note = e.target.value.trim(); save(); render();
    }}),
    el('p', { class: 'summary', text: summary })
  );

  for (const item of cat.items) {
    const select = el('select', { 'aria-label': `Dónde está ${item.name}`, onchange: e => {
      item.where = e.target.value; save(); render();
    }},
      el('option', { value: '', text: 'Dónde…' }),
      ...LOCATIONS.map(l => el('option', { value: l, text: l }))
    );
    select.value = item.where;

    const row = el('div', { class: 'item' + (item.packed ? ' packed' : '') },
      el('input', { type: 'checkbox', checked: item.packed, 'aria-label': 'Empaquetado', onchange: e => {
        item.packed = e.target.checked; save(); render();
      }}),
      el('input', { class: 'name', value: item.name, 'aria-label': 'Nombre', onchange: e => {
        item.name = e.target.value.trim() || item.name; save(); render();
      }}),
      el('button', { class: 'del', text: 'Borrar', onclick: () => {
        cat.items = cat.items.filter(i => i !== item); save(); render();
      }}),
      el('div', { class: 'meta' },
        el('input', { type: 'number', min: '0', class: 'qty', value: item.qty, 'aria-label': 'Cantidad', onchange: e => {
          item.qty = Math.max(0, parseInt(e.target.value, 10) || 0); save(); render();
        }}),
        select,
        sugBtn(item),
        cat.id === 'ropa' ? wornBtn(item) : null,
        el('span', { class: 'total', text: `Total ${totalOf(item)}` })
      )
    );
    list.append(row);
  }

  list.append(el('form', { class: 'add', onsubmit: e => {
    e.preventDefault();
    const name = e.target.elements.name.value.trim();
    if (!name) return;
    cat.items.push({ id: uid(), name, qty: 1, where: '', packed: false, worn: false });
    save(); render();
  }},
    el('input', { name: 'name', placeholder: 'Añadir objeto', 'aria-label': 'Añadir objeto' }),
    el('button', { type: 'submit', text: 'Añadir' })
  ));
  return list;
}

// Vista por maleta: una subsección por cada opción de "Dónde"
function renderByBag() {
  const card = el('section', { class: 'card' }, el('h2', { text: 'Por maleta' }));
  const groups = [...LOCATIONS, ''];
  for (const loc of groups) {
    const lines = [];
    let sum = 0;
    for (const cat of state.categories) for (const item of cat.items) {
      if (item.where === loc && item.qty > 0) {
        sum += item.qty;
        lines.push(el('div', { class: 'line' },
          el('span', {}, item.name, el('span', { class: 'catname', text: ` · ${cat.name}` })),
          el('span', { class: 'qtyv', text: `×${item.qty}` })
        ));
      }
    }
    if (loc === '' && !lines.length) continue;
    card.append(el('div', { class: 'bagsec' },
      el('div', { class: 'bagtitle', text: `${loc || 'Sin dónde'} · ${sum}` }),
      ...(lines.length ? lines : [el('div', { class: 'empty', text: 'Nada asignado todavía' })])
    ));
  }
  return card;
}

function sugBtn(item) {
  const s = suggestion(item);
  if (s === null) return null;
  return el('button', { class: 'sug', text: `Sugerido ${s}`, onclick: () => {
    item.qty = Math.max(0, s - wornUnits(item));
    save(); render();
  }});
}

function wornBtn(item) {
  return el('button', { class: 'sug' + (item.worn ? ' on' : ''), text: item.worn ? 'Puesto ✓' : 'Lo llevo puesto', onclick: () => {
    item.worn = !item.worn; save(); render();
  }});
}

function applySuggestions() {
  state.categories.forEach(c => c.items.forEach(i => {
    const s = suggestion(i);
    if (s !== null) i.qty = Math.max(0, s - wornUnits(i));
  }));
  save(); render();
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: 'equipaje-respaldo.json' });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importButton() {
  const input = el('input', { type: 'file', accept: 'application/json,.json', style: 'display:none', onchange: e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.categories)) throw new Error('formato');
        state = normalize(data);
        save(); render();
      } catch (err) {
        alert('Ese archivo no es una copia válida de la lista.');
      }
    };
    reader.readAsText(file);
  }});
  return el('button', { text: 'Importar copia', onclick: () => input.click() }, input);
}

render();
</script>
</body>
</html>
