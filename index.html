<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Equipaje">
<meta name="theme-color" content="#F6F3EE">
<title>Lista de equipaje</title>
<style>
  :root {
    --bg: #F6F3EE; --card: #FFFFFF; --fg: #1F1D1A; --muted: #7A746B;
    --line: #E4DED4; --accent: #1F6F6B; --accent-fg: #FFFFFF; --danger: #B5483A;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161513; --card: #211F1C; --fg: #F2EEE7; --muted: #958E84;
      --line: #36322D; --accent: #5FB8B2; --accent-fg: #101414; --danger: #E08072;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px))
         env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
  main { max-width: 640px; margin: 0 auto; padding-block: 16px 48px; }
  h1 { font-size: 28px; margin: 4px 0 12px; letter-spacing: -0.02em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); flex: 1; min-width: 0; }
  input { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 10px; width: 100%; min-width: 0; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .row2 { display: flex; gap: 10px; }
  .row2 label.field:first-child { flex: 0 0 90px; }
  .progress { margin: 4px 0 18px; }
  .track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar { height: 100%; background: var(--accent); transition: width .2s; }
  .progress span { display: block; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .item { display: grid; grid-template-columns: 28px 1fr 64px; gap: 8px; align-items: center;
    padding: 8px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .item .where { grid-column: 2 / 3; }
  .item .meta { grid-column: 2 / 4; display: flex; gap: 8px; }
  .item .meta input { padding: 6px 8px; font-size: 14px; }
  input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; }
  .packed .name { text-decoration: line-through; color: var(--muted); }
  .name { border: 0; padding: 4px 0; font-size: 16px; }
  .qty { text-align: center; }
  .del { background: none; border: 0; color: var(--danger); font: inherit; font-size: 13px; padding: 4px; justify-self: end; }
  form.add { display: flex; gap: 8px; margin-top: 10px; }
  button { font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
    color: var(--fg); padding: 10px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 600; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; }
  .tools button { flex: 1 1 auto; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 16px; line-height: 1.5; }
</style>
</head>
<body>
<main id="app"></main>
<script>
const KEY = 'packing-list-v1';

let uidCounter = 0;
function uid() { return 'i' + Date.now().toString(36) + (++uidCounter); }

const seed = {
  trip: { destination: '', days: 5, luggage: 'Carry-on + personal' },
  categories: [
    { id: 'ropa', name: 'Ropa', items: [
      ['Camisetas', 4], ['Pantalones', 3], ['Ropa interior', 6], ['Calcetines', 6],
      ['Pijama', 1], ['Zapatos', 1], ['Chanclas', 1]
    ]},
    { id: 'aseo', name: 'Aseo', items: [
      ['Desodorante', 1], ['Cepillo de dientes', 1], ['Pasta de dientes', 1], ['Enjuague bucal', 1],
      ['Cepillo del pelo', 1], ['Serum', 1], ['Protector solar', 1], ['Crema de ojos', 1],
      ['Champú', 1], ['Gel facial', 1], ['Esponja', 1], ['Maquinilla', 1]
    ]},
    { id: 'electronica', name: 'Electrónica', items: [
      ['Cargador simple', 1], ['Cargador múltiple', 1], ['Cable C a C 180 cm', 1], ['Cable C a C 100 cm', 1],
      ['Cable C a C 30 cm', 1], ['Cable A a C 100 cm', 1], ['Powerbank 10.000 mAh', 1],
      ['Powerbank 20.000 mAh', 1], ['AirPods', 1], ['Sony XM5', 1], ['AirFly', 1],
      ['Báscula de equipaje', 1], ['Adaptador Américas', 1], ['Adaptador Europa', 1]
    ]}
  ].map(c => ({ id: c.id, name: c.name, items: c.items.map(([name, qty]) => ({
    id: uid(), name, qty, where: '', packed: false })) }))
};

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return structuredClone(seed);
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

let state = load();

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'checked') n.checked = v;
    else if (k === 'value') n.value = v;
    else n.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) n.append(c);
  return n;
}

function field(labelText, value, onChange, type = 'text', placeholder = '') {
  const input = el('input', { type, value: value ?? '', placeholder, onchange: e => onChange(e.target.value) });
  return el('label', { class: 'field' }, labelText, input);
}

function render() {
  const app = document.getElementById('app');
  app.replaceChildren();

  const all = state.categories.flatMap(c => c.items);
  const done = all.filter(i => i.packed).length;
  const pct = all.length ? Math.round(done / all.length * 100) : 0;

  app.append(
    el('h1', { text: 'Equipaje' }),
    el('section', { class: 'card' },
      field('Destino', state.trip.destination, v => { state.trip.destination = v; save(); }, 'text', 'Ej.: Lisboa'),
      el('div', { class: 'row2', style: 'margin-top:10px' },
        field('Días', state.trip.days, v => { state.trip.days = v; save(); }, 'number'),
        field('Equipaje', state.trip.luggage, v => { state.trip.luggage = v; save(); }, 'text', 'Ej.: Maleta grande')
      )
    ),
    el('div', { class: 'progress' },
      el('div', { class: 'track' }, el('div', { class: 'bar', style: `width:${pct}%` })),
      el('span', { text: `${done} de ${all.length} empaquetados` })
    )
  );

  for (const cat of state.categories) app.append(renderCategory(cat));

  app.append(
    el('section', { class: 'card' },
      el('h2', { text: 'Nueva categoría' }),
      el('form', { class: 'add', onsubmit: e => {
        e.preventDefault();
        const input = e.target.elements.name;
        const name = input.value.trim();
        if (!name) return;
        state.categories.push({ id: uid(), name, items: [] });
        save(); render();
      }},
        el('input', { name: 'name', placeholder: 'Ej.: Documentos', 'aria-label': 'Nombre de la categoría' }),
        el('button', { class: 'primary', type: 'submit', text: 'Añadir' })
      )
    ),
    el('div', { class: 'tools' },
      el('button', { text: 'Desmarcar todo', onclick: () => {
        state.categories.forEach(c => c.items.forEach(i => i.packed = false));
        save(); render();
      }}),
      el('button', { text: 'Exportar copia', onclick: exportData }),
      importButton()
    ),
    el('p', { class: 'hint', text: 'Tus datos se guardan en este iPhone. Usa "Exportar copia" de vez en cuando para tener un respaldo.' })
  );
}

function renderCategory(cat) {
  const list = el('div', { class: 'card' }, el('h2', { text: cat.name }));
  for (const item of cat.items) {
    const row = el('div', { class: 'item' + (item.packed ? ' packed' : '') },
      el('input', { type: 'checkbox', checked: item.packed, 'aria-label': 'Empaquetado', onchange: e => {
        item.packed = e.target.checked; save(); render();
      }}),
      el('input', { class: 'name', value: item.name, 'aria-label': 'Nombre', onchange: e => {
        item.name = e.target.value.trim() || item.name; save(); render();
      }}),
      el('button', { class: 'del', text: 'Borrar', onclick: () => {
        cat.items = cat.items.filter(i => i !== item); save(); render();
      }}),
      el('div', { class: 'meta' },
        el('input', { type: 'number', min: '0', class: 'qty', value: item.qty, 'aria-label': 'Cantidad', style: 'width:64px', onchange: e => {
          item.qty = Math.max(0, parseInt(e.target.value, 10) || 0); save();
        }}),
        el('input', { type: 'text', value: item.where, placeholder: 'Dónde (maleta, bolsillo…)', 'aria-label': 'Dónde', onchange: e => {
          item.where = e.target.value; save();
        }})
      )
    );
    list.append(row);
  }
  list.append(el('form', { class: 'add', onsubmit: e => {
    e.preventDefault();
    const input = e.target.elements.name;
    const name = input.value.trim();
    if (!name) return;
    cat.items.push({ id: uid(), name, qty: 1, where: '', packed: false });
    save(); render();
  }},
    el('input', { name: 'name', placeholder: 'Añadir objeto', 'aria-label': 'Añadir objeto' }),
    el('button', { type: 'submit', text: 'Añadir' })
  ));
  return list;
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: 'equipaje-respaldo.json' });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importButton() {
  const input = el('input', { type: 'file', accept: 'application/json,.json', style: 'display:none', onchange: e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.categories)) throw new Error('formato');
        state = data;
        save(); render();
      } catch (err) {
        alert('Ese archivo no es una copia válida de la lista.');
      }
    };
    reader.readAsText(file);
  }});
  return el('button', { text: 'Importar copia', onclick: () => input.click() }, input);
}

render();
</script>
</body>
</html>
